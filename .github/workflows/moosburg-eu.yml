name: Deploy auf moosburg.eu/data/wahlen/

# Die Wahlkarte ist statisch und ohne Build-Step; ausgeliefert wird eine
# zusammengestellte Auswahl: index.html, src/, die fertig gerechneten Daten
# und der Zeichner hexagonalmap. Der kommt auf GitHub Pages per importmap
# von bagruber.github.io — auf moosburg.eu verbietet das die
# Content-Security-Policy der Domain (script-src 'self'), deshalb liegt er
# in der Auslieferung lokal bei. Die importmap selbst faellt dort auch unter
# die CSP, weil sie inline steht; deshalb entfaellt sie, und der eine Import
# zeigt direkt auf die lokale Kopie.
# Bewusst im Workflow statt im Repo: der lokale Zeichner ist eine Eigenheit
# dieses Hosts, die Pages-Variante bleibt unverändert.
#
# Braucht die Secrets FTP_HOST, FTP_USER, FTP_PASSWORD (dieselben wie in den
# Geschwister-Repos); ohne sie scheitert der Spiegel-Schritt.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-data-wahlen
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Auslieferung zusammenstellen
        run: |
          mkdir -p dist/data dist/vendor/hexagonalmap
          cp index.html favicon.svg dist/
          cp -r src dist/src
          cp -r data/wahlen data/kartogramm dist/data/
          cp node_modules/hexagonalmap/src/core/*.js dist/vendor/hexagonalmap/
          perl -0pi -e 's#\s*<script type="importmap">.*?</script>##s' dist/index.html
          sed -i 's|from "hexagonalmap/svg"|from "../../vendor/hexagonalmap/svg.js"|' dist/src/kern/zeichne.js
          # Scheitern statt still kaputt ausliefern: bleibt die Map stehen oder
          # importiert ein Browser-Modul den Zeichner noch nackt, findet der
          # Browser ihn auf moosburg.eu nicht. kern/karte.js laeuft nur in Node.
          if grep -q importmap dist/index.html; then echo "Import Map noch in index.html"; exit 1; fi
          if grep -rl '"hexagonalmap/' dist/src | grep -v 'kern/karte.js'; then echo "nackter Import uebrig"; exit 1; fi

      - name: Nach data/wahlen/ spiegeln
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASSWORD }}
          protocol: ftps
          local-dir: ./dist/
          server-dir: data/wahlen/

          # Alle Projekte teilen sich ein FTP-Konto. Kurz nach einer anderen
          # Übertragung nimmt Hostinger die Verbindung verzögert an, und die
          # 30 s Standard-Timeout der Action reichen dann nicht.
          timeout: 120000
